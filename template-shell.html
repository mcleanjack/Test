<meta charset="UTF-8">
<title>Letterbox Turntable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bg-2: #f4f5f7;
    --panel-border: #e4e6eb;
    --text: #1a1c23;
    --muted: #9aa0ac;
    --accent: #2a2620;
    --accent-ui: #000000;
    --grid-line: #c7c9cf;
    --neu-dark: rgba(0, 0, 0, 0.12);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111318;
      --bg-2: #181a20;
      --panel-border: #2a2d35;
      --text: #e8eaed;
      --muted: #8b8f99;
      --accent: #ece7d9;
      --accent-ui: #f4f4f4;
      --grid-line: #43464f;
      --neu-dark: rgba(0, 0, 0, 0.55);
    }
  }

  :root[data-theme="dark"] {
    --bg: #111318;
    --bg-2: #181a20;
    --panel-border: #2a2d35;
    --text: #e8eaed;
    --muted: #8b8f99;
    --accent: #ece7d9;
    --accent-ui: #f4f4f4;
    --grid-line: #43464f;
    --neu-dark: rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow: hidden;
  }

  body {
    position: relative;
    background-color: var(--bg);
    background-image: radial-gradient(ellipse at 50% 42%, var(--bg) 0%, var(--bg-2) 100%);
  }

  #stage {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    outline: none;
  }

  .brand-logo {
    position: absolute;
    top: 34px;
    left: 34px;
    z-index: 6;
    color: var(--text);
    pointer-events: none;
  }
  .brand-logo svg { display: block; height: 24px; width: auto; filter: drop-shadow(0 6px 10px var(--neu-dark)) drop-shadow(0 2px 3px var(--neu-dark)); }

  .hint {
    position: absolute;
    bottom: 30px;
    right: 34px;
    z-index: 6;
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.04em;
    opacity: 0.75;
    text-align: right;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .hint.hidden { opacity: 0; }

  .info-box {
    position: absolute;
    bottom: 56px;
    left: 50%;
    width: max-content;
    max-width: 78vw;
    text-align: center;
    font-family: "Inter", Arial, Helvetica, "Segoe UI", sans-serif;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    background: #16161f;
    color: #ffffff;
    padding: 14px 26px;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    z-index: 6;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 6px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .info-box.visible { opacity: 1; transform: translate(-50%, 0); }

  .title-block {
    position: absolute;
    top: 34px;
    left: 50%;
    z-index: 6;
    text-align: center;
    pointer-events: none;
    transform: translateX(-50%);
    font-family: "Inter", Arial, Helvetica, "Segoe UI", sans-serif;
  }
  .title-block .title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text);
  }
  .title-block .subtitle {
    margin-top: 3px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .view-toggle {
    position: absolute;
    top: 30px;
    right: 34px;
    z-index: 6;
    display: flex;
    gap: 2px;
    background: var(--bg);
    border-radius: 999px;
    padding: 4px;
    box-shadow: 0 4px 14px var(--neu-dark);
  }
  .view-toggle button {
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: Arial, Helvetica, "Segoe UI", sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .view-toggle button.active { background: var(--accent-ui); color: var(--bg); }
  .view-toggle button:focus-visible { outline: 2px solid var(--accent-ui); outline-offset: 2px; }

  .topbar-tools {
    position: absolute;
    top: 92px;
    left: 34px;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .part-nav, .zoom-control {
    display: flex;
    align-items: center;
    background: var(--bg);
    border-radius: 999px;
    box-shadow: 0 4px 14px var(--neu-dark);
  }
  .part-nav { padding: 4px; gap: 2px; }
  .part-nav button, .zoom-control button {
    border: none;
    background: transparent;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .part-nav button { width: 32px; height: 32px; }
  .part-nav button svg { width: 16px; height: 16px; }
  .part-nav button:hover, .zoom-control button:hover { background: var(--bg-2); }
  .part-nav .divider { width: 1px; height: 18px; background: var(--panel-border); }
  .zoom-control { padding: 4px 6px; gap: 6px; }
  .zoom-control button { width: 28px; height: 28px; }
  .zoom-control button svg { width: 14px; height: 14px; }
  .zoom-control .zoom-value {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--muted);
    min-width: 34px;
    text-align: center;
    letter-spacing: 0.02em;
  }
  .part-nav button:focus-visible, .zoom-control button:focus-visible {
    outline: 2px solid var(--accent-ui);
    outline-offset: 2px;
  }

  .spin-toggle {
    position: absolute;
    left: 50%;
    top: 152px;
    z-index: 6;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    border: none;
    background: var(--bg);
    color: var(--text);
    border-radius: 999px;
    padding: 16px 22px;
    cursor: pointer;
    font-family: Arial, Helvetica, "Segoe UI", sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    box-shadow: 0 4px 14px var(--neu-dark);
    transition: background 0.2s ease, color 0.2s ease, box-shadow 0.15s ease, transform 0.1s ease, opacity 0.2s ease;
  }
  .spin-toggle svg { width: 20px; height: 20px; display: block; }
  .spin-toggle:hover { box-shadow: 0 6px 18px var(--neu-dark); }
  .spin-toggle:active { transform: translateX(-50%) scale(0.97); }
  .spin-toggle.engaged { background: var(--accent-ui); color: var(--bg); }
  .spin-toggle:disabled { opacity: 0.4; cursor: not-allowed; }
  .spin-toggle:focus-visible { outline: 2px solid var(--accent-ui); outline-offset: 3px; }

  #loading {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--bg);
    transition: opacity 0.5s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid var(--panel-border);
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 1.6s; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading .msg {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #loading .err {
    color: var(--accent);
    font-size: 12px;
    max-width: 360px;
    text-align: center;
    letter-spacing: 0.02em;
    text-transform: none;
  }

  #stage.ready { animation: fadein 0.6s ease both; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  @media (max-width: 640px) {
    .brand-logo { top: 20px; left: 20px; }
    .brand-logo svg { height: 20px; }
    .hint { left: 20px; right: 18px; }
    .title-block { display: none; }
    .view-toggle { top: 18px; right: 18px; padding: 3px; }
    .view-toggle button { padding: 6px 10px; font-size: 10px; }
    .topbar-tools { top: 62px; left: 18px; gap: 6px; }
    .zoom-control .zoom-value { min-width: 28px; font-size: 10px; }
    .info-box { bottom: 30px; }
    .spin-toggle { top: 108px; padding: 12px 16px; font-size: 11px; }
    .spin-toggle svg { width: 17px; height: 17px; }
  }
</style>

<canvas id="stage" role="img" aria-label="3D turntable view of the integrated letterbox model. Drag to orbit."></canvas>

<div class="brand-logo">
<!--__LOGO_SVG__-->
</div>

<div class="hint" id="drag-hint">Drag to orbit &middot; scroll to zoom</div>

<div class="title-block">
  <div class="title">Integrated Letter Box</div>
  <div class="subtitle">Brushed Steel &middot; Matte Black Slat Fence</div>
</div>

<div class="view-toggle" id="view-toggle">
  <button type="button" class="active" data-mode="3d" aria-pressed="true">3D</button>
  <button type="button" data-mode="2d" aria-pressed="false">2D</button>
</div>

<div class="topbar-tools">
  <div class="part-nav">
    <button type="button" id="part-prev" aria-label="Previous part">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"></polyline></svg>
    </button>
    <span class="divider"></span>
    <button type="button" id="part-next" aria-label="Next part">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>
    </button>
  </div>
  <div class="zoom-control">
    <button type="button" id="zoom-out" aria-label="Zoom out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
    <span class="zoom-value" id="zoom-value">100%</span>
    <button type="button" id="zoom-in" aria-label="Zoom in">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line><line x1="12" y1="5" x2="12" y2="19"></line></svg>
    </button>
  </div>
</div>

<div class="info-box" id="info-box"></div>

<button type="button" class="spin-toggle" id="spin-toggle" aria-label="Toggle auto-rotate" aria-pressed="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 3 6.7"></path><polyline points="3 17 3 21 7 21"></polyline></svg>
  <span>360&deg;</span>
</button>

<div id="loading">
  <div class="spinner" id="spinner"></div>
  <div class="msg" id="loading-msg">Loading model&hellip;</div>
</div>

<script>
/*__BUNDLE_JS__*/
</script>

<script>
(function () {
  var FBX_BASE64 = "__FBX_BASE64__";

  function base64ToArrayBuffer(base64) {
    var binary = atob(base64);
    var len = binary.length;
    var bytes = new Uint8Array(len);
    for (var i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
    return bytes.buffer;
  }

  var THREE = window.THREE;
  var FBXLoader = window.FBXLoader;
  var OrbitControls = window.OrbitControls;
  var RoomEnvironment = window.RoomEnvironment;
  var LineSegments2 = window.LineSegments2;
  var LineSegmentsGeometry = window.LineSegmentsGeometry;
  var LineMaterial = window.LineMaterial;

  var canvas = document.getElementById('stage');
  var loadingEl = document.getElementById('loading');
  var loadingMsg = document.getElementById('loading-msg');
  var spinnerEl = document.getElementById('spinner');
  var dragHint = document.getElementById('drag-hint');
  var infoBox = document.getElementById('info-box');
  var partPrevBtn = document.getElementById('part-prev');
  var partNextBtn = document.getElementById('part-next');
  var zoomInBtn = document.getElementById('zoom-in');
  var zoomOutBtn = document.getElementById('zoom-out');
  var zoomValueEl = document.getElementById('zoom-value');
  var viewToggle = document.getElementById('view-toggle');
  var viewToggleBtns = viewToggle.querySelectorAll('button');
  var spinToggle = document.getElementById('spin-toggle');

  function readAccent() {
    var v = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    return v || '#2a2620';
  }
  function readBg() {
    var v = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    return v || '#15130f';
  }
  function readGridColor() {
    var v = getComputedStyle(document.documentElement).getPropertyValue('--grid-line').trim();
    return v || '#c7c9cf';
  }

  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var scene = new THREE.Scene();
  var bgColor = new THREE.Color(readBg());
  scene.fog = new THREE.Fog(bgColor.getHex(), 6, 22);

  var camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.05, 200);
  camera.position.set(3.1, 1.7, 3.6);

  var controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 1.2;
  controls.maxDistance = 12;
  controls.maxPolarAngle = Math.PI * 0.53;
  controls.target.set(0, 0.5, 0);
  controls.update();

  // Lighting: warm key + cool fill + soft rim, studio-style.
  var hemi = new THREE.HemisphereLight(0xfff3e0, 0x14110c, 0.65);
  scene.add(hemi);

  var key = new THREE.DirectionalLight(0xfff1de, 2.1);
  key.position.set(3.2, 4.4, 2.6);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.near = 1;
  key.shadow.camera.far = 14;
  key.shadow.camera.left = -3;
  key.shadow.camera.right = 3;
  key.shadow.camera.top = 3;
  key.shadow.camera.bottom = -3;
  key.shadow.bias = -0.0015;
  key.shadow.radius = 3;
  scene.add(key);

  var fill = new THREE.DirectionalLight(0x9fc7ff, 0.55);
  fill.position.set(-3.5, 1.8, -1.5);
  scene.add(fill);

  var rim = new THREE.DirectionalLight(0xffd9ad, 0.9);
  rim.position.set(-1.2, 2.6, -3.4);
  scene.add(rim);

  // Ground grid: real 3D geometry using the scene's actual camera, so it's
  // inherently perspective-correct and shares the model's own vanishing
  // points (a flat CSS pattern could never honestly claim this). Cell size
  // (~1 unit) keeps near-field lines individually legible rather than
  // crowding into a hazy horizon band; the fixed extent sits just past the
  // fog's far distance so it fades out smoothly instead of showing a hard
  // edge. Sits at ground level, below the contact shadow decal.
  //
  // Built by hand (not THREE.GridHelper) so each line can carry a subtle
  // "curved-earth" bend: every vertex is displaced by -(x²+z²)/CURVE_RADIUS,
  // an offset that grows with squared distance from the origin, so it's
  // negligible near the model and only becomes visible toward the fogged
  // outer edge — flat foreground, progressive curve toward the horizon.
  // Curvature is centered on the world origin (where the model and the
  // camera's orbit target both already sit), so it's genuine 3D geometry
  // that reads correctly from any orbit angle, not a screen-space fake.
  // Each line is built from many short segments (not one long span) so the
  // bend looks smooth rather than kinked.
  // Vertex color fades from the grid color at the center toward the page
  // background color at the outer edge, so the curved/receding portion
  // dissolves into the backdrop instead of ending abruptly — independent of
  // (and in addition to) the scene's own distance fog.
  function buildCurvedGridGeometry(size, divisions, segmentsPerLine, curveRadius, gridColor, bgColor) {
    var half = size / 2;
    var maxDist = Math.sqrt(half * half * 2);
    function curveY(x, z) { return -(x * x + z * z) / curveRadius; }
    var positions = [];
    var colors = [];
    var tmp = new THREE.Color();
    function addVert(x, z) {
      positions.push(x, curveY(x, z), z);
      var t = Math.min(Math.sqrt(x * x + z * z) / maxDist, 1);
      tmp.copy(gridColor).lerp(bgColor, t);
      colors.push(tmp.r, tmp.g, tmp.b);
    }
    for (var i = 0; i <= divisions; i++) {
      var x = -half + (i / divisions) * size;
      for (var s = 0; s < segmentsPerLine; s++) {
        var z0 = -half + (s / segmentsPerLine) * size;
        var z1 = -half + ((s + 1) / segmentsPerLine) * size;
        addVert(x, z0);
        addVert(x, z1);
      }
    }
    for (var j = 0; j <= divisions; j++) {
      var z2 = -half + (j / divisions) * size;
      for (var t2 = 0; t2 < segmentsPerLine; t2++) {
        var x0 = -half + (t2 / segmentsPerLine) * size;
        var x1 = -half + ((t2 + 1) / segmentsPerLine) * size;
        addVert(x0, z2);
        addVert(x1, z2);
      }
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    return geo;
  }
  var groundGrid = new THREE.LineSegments(
    buildCurvedGridGeometry(30, 40, 24, 90, new THREE.Color(readGridColor()), new THREE.Color(readBg())),
    new THREE.LineBasicMaterial({
      vertexColors: true,
      transparent: true,
      opacity: 0.35,
      depthWrite: false
    })
  );
  groundGrid.position.y = -0.003;
  scene.add(groundGrid);

  // Soft circular contact shadow: a stylized, simplified shadow shape (not
  // the model's exact irregular cast-shadow silhouette), painted as a
  // radial-gradient alpha texture on a flat unlit disc — same "generate a
  // canvas texture" pattern as makeAggregateTextures() above. Unlit and
  // painted (not physically shadow-mapped) so its darkness stays consistent
  // regardless of theme or light angle.
  function makeShadowTexture() {
    var size = 512;
    var canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    var ctx = canvas.getContext('2d');
    var grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    grad.addColorStop(0, 'rgba(0,0,0,0.225)');
    grad.addColorStop(0.7, 'rgba(0,0,0,0.11)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);
    var tex = new THREE.CanvasTexture(canvas);
    return tex;
  }
  var contactShadowGeo = new THREE.CircleGeometry(1, 64);
  var contactShadowMat = new THREE.MeshBasicMaterial({
    map: makeShadowTexture(),
    transparent: true,
    depthWrite: false
  });
  var contactShadow = new THREE.Mesh(contactShadowGeo, contactShadowMat);
  contactShadow.rotation.x = -Math.PI / 2;
  scene.add(contactShadow);

  var pivot = new THREE.Group();
  scene.add(pivot);

  controls.addEventListener('start', function () {
    dragHint.classList.add('hidden');
    if (controls.autoRotate) {
      controls.autoRotate = false;
      spinToggle.classList.remove('engaged');
      spinToggle.setAttribute('aria-pressed', 'false');
    }
  });

  // Simple camera-position/target tween, reusing the same lerp-toward-target
  // technique as the opacity animation in updateIsolation() below. Driving
  // camera.position/controls.target directly (rather than simulating drag
  // input) is the same approach frameObject() already uses to place the
  // camera, so OrbitControls picks it up cleanly on the next update().
  var camTween = null;
  function tweenCameraTo(pos, target, duration) {
    camTween = {
      fromPos: camera.position.clone(),
      toPos: pos.clone(),
      fromTarget: controls.target.clone(),
      toTarget: target.clone(),
      start: performance.now(),
      duration: duration || 650
    };
  }
  function updateCameraTween() {
    if (!camTween) return;
    var t = (performance.now() - camTween.start) / camTween.duration;
    if (t >= 1) {
      camera.position.copy(camTween.toPos);
      controls.target.copy(camTween.toTarget);
      camTween = null;
    } else {
      var e = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
      camera.position.lerpVectors(camTween.fromPos, camTween.toPos, e);
      controls.target.lerpVectors(camTween.fromTarget, camTween.toTarget, e);
    }
  }

  // Zoom control: defaultDistance is captured once the model has been framed
  // (see frameObject() call below) so the on-screen "%" reads 100% at the
  // initial framed view, regardless of the model's absolute scale.
  var defaultDistance = null;
  function updateZoomReadout() {
    if (defaultDistance === null) return;
    var dist = camera.position.distanceTo(controls.target);
    zoomValueEl.textContent = Math.round((defaultDistance / dist) * 100) + '%';
  }
  function stepZoom(factor) {
    if (defaultDistance === null) return;
    var offset = new THREE.Vector3().subVectors(camera.position, controls.target);
    var newDist = THREE.MathUtils.clamp(offset.length() * factor, controls.minDistance, controls.maxDistance);
    offset.setLength(newDist);
    camera.position.copy(controls.target).add(offset);
    controls.update();
    updateZoomReadout();
  }
  zoomInBtn.addEventListener('click', function () { stepZoom(0.88); });
  zoomOutBtn.addEventListener('click', function () { stepZoom(1 / 0.88); });
  controls.addEventListener('change', updateZoomReadout);

  // 2D/3D view toggle. "2D" is a locked straight-on front elevation (rotate
  // disabled, camera pinned to eye-level with the target) rather than a true
  // orthographic camera swap — much lower-risk than threading a second camera
  // type through the existing outline/pick/frame pipeline, and reads the same
  // for a single small product model. "3D" restores the original framed view.
  var defaultView = null;
  var currentMode = '3d';
  function enter2D() {
    if (!defaultView) return;
    currentMode = '2d';
    controls.enableRotate = false;
    controls.minPolarAngle = Math.PI / 2;
    controls.maxPolarAngle = Math.PI / 2;
    if (controls.autoRotate) {
      controls.autoRotate = false;
      spinToggle.classList.remove('engaged');
      spinToggle.setAttribute('aria-pressed', 'false');
    }
    spinToggle.disabled = true;
    var dir = defaultView.position.clone().sub(defaultView.target);
    dir.y = 0;
    if (dir.lengthSq() < 1e-6) dir.set(0, 0, 1);
    dir.normalize();
    var dist = camera.position.distanceTo(controls.target);
    var flatPos = defaultView.target.clone().addScaledVector(dir, dist);
    flatPos.y = defaultView.target.y;
    tweenCameraTo(flatPos, defaultView.target, 650);
  }
  function enter3D() {
    if (!defaultView) return;
    currentMode = '3d';
    controls.enableRotate = true;
    controls.minPolarAngle = 0;
    controls.maxPolarAngle = Math.PI * 0.53;
    spinToggle.disabled = false;
    tweenCameraTo(defaultView.position, defaultView.target, 650);
  }
  viewToggleBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var mode = btn.getAttribute('data-mode');
      if (mode === currentMode) return;
      viewToggleBtns.forEach(function (b) {
        b.classList.toggle('active', b === btn);
        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
      });
      if (mode === '2d') enter2D(); else enter3D();
    });
  });

  // 360deg pill: opt-in auto-rotate. Manual drag always cancels it (see the
  // controls 'start' listener above), so it never fights the user.
  controls.autoRotateSpeed = 2.4;
  spinToggle.addEventListener('click', function () {
    controls.autoRotate = !controls.autoRotate;
    spinToggle.classList.toggle('engaged', controls.autoRotate);
    spinToggle.setAttribute('aria-pressed', controls.autoRotate ? 'true' : 'false');
  });

  function frameObject(object) {
    var box = new THREE.Box3().setFromObject(object);
    var size = new THREE.Vector3();
    var center = new THREE.Vector3();
    box.getSize(size);
    box.getCenter(center);

    var maxDim = Math.max(size.x, size.y, size.z) || 1;
    var scale = 2.1 / maxDim;
    object.scale.setScalar(scale);

    box.setFromObject(object);
    box.getSize(size);
    box.getCenter(center);
    object.position.x -= center.x;
    object.position.z -= center.z;
    object.position.y -= box.min.y;
    object.updateMatrixWorld(true);

    // Ground the model on the base plate, not the anchor-bolt tips: the bolts'
    // threaded ends already extend below the plate to embed in the paving, so
    // sink the whole model until the plate (not the bolts) sits flush on top.
    var plateBox = new THREE.Box3();
    var hasPlate = false;
    object.traverse(function (child) {
      // Skip sketch-outline lines here: they're unnamed children riding along
      // on every mesh (including the Hilti bolts), so a name-only filter lets
      // a bolt's own outline slip through and drag the plate reference back
      // down to the bolt tip.
      if (child.isMesh && !child.isLineSegments2 && child.name.indexOf('Hilti') === -1) {
        hasPlate = true;
        plateBox.union(new THREE.Box3().setFromObject(child));
      }
    });
    if (hasPlate) {
      object.position.y -= plateBox.min.y;
      object.updateMatrixWorld(true);
    }

    // Float the model above the paving (classic product-shot look) instead
    // of sitting flush on it; the contact shadow below stands in for the
    // ground contact instead.
    object.position.y += 0.15;
    object.updateMatrixWorld(true);

    box.setFromObject(object);
    var sphere = new THREE.Sphere();
    box.getBoundingSphere(sphere);
    var midY = (box.min.y + box.max.y) / 2;

    var fovRad = camera.fov * Math.PI / 180;
    var dist = (sphere.radius / Math.sin(fovRad / 2)) * 1.35;
    var dir = new THREE.Vector3(-1.5, 0.5, 0.9).normalize();
    camera.position.copy(dir.multiplyScalar(dist).add(new THREE.Vector3(0, midY * 0.25, 0)));
    controls.target.set(0, midY, 0);
    controls.minDistance = dist * 0.35;
    controls.maxDistance = dist * 3.2;
    controls.update();

    // Contact shadow: scaled directly off the model's own bounding-sphere
    // radius so it stays proportionate to the model at any size, comfortably
    // grounding the whole thing without dwarfing it. Centered under it, with
    // a soft feathered edge doing the rest of the work.
    contactShadow.scale.setScalar(sphere.radius * 1.3);
    contactShadow.position.y = 0.012;

    scene.fog.near = dist * 1.4;
    scene.fog.far = dist * 5.5;
  }

  // Studio environment map for believable metal reflections (no external HDRI fetch).
  var pmrem = new THREE.PMREMGenerator(renderer);
  var envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environment = envTex;
  pmrem.dispose();

  var brushedSteel = new THREE.MeshStandardMaterial({
    color: 0xdaddde,
    metalness: 0.95,
    roughness: 0.3,
    envMapIntensity: 1.4
  });
  var matteBlack = new THREE.MeshStandardMaterial({
    color: 0x18181a,
    metalness: 0.25,
    roughness: 0.72,
    envMapIntensity: 0.6
  });
  var darkHardware = new THREE.MeshStandardMaterial({
    color: 0x2b2b2c,
    metalness: 0.6,
    roughness: 0.5,
    envMapIntensity: 0.8
  });

  function materialForName(name) {
    if (name.indexOf('LETTERBOX') !== -1) return brushedSteel;
    if (name.indexOf('FENCE') !== -1) return matteBlack;
    if (name.indexOf('Hilti') !== -1) return darkHardware;
    return brushedSteel;
  }

  // Hand-inked edge outline, layered on top of the shaded materials without
  // touching them: hard edges via EdgesGeometry, drawn as fat (multi-pixel)
  // lines so they read as ink strokes instead of the 1px hairlines WebGL's
  // plain LineBasicMaterial is capped to on most browsers.
  var outlineMaterials = [];
  function addSketchOutline(mesh) {
    if (!mesh.geometry) return;
    var edges = new THREE.EdgesGeometry(mesh.geometry, 25);
    var lineGeo = new LineSegmentsGeometry().fromEdgesGeometry(edges);
    var lineMat = new LineMaterial({
      color: new THREE.Color(readAccent()).getHex(),
      linewidth: 1.7,
      worldUnits: false,
      resolution: new THREE.Vector2(window.innerWidth, window.innerHeight),
      transparent: true,
      opacity: 0.85
    });
    var line = new LineSegments2(lineGeo, lineMat);
    line.computeLineDistances();
    mesh.add(line);
    outlineMaterials.push(lineMat);
    return lineMat;
  }

  // Click-to-isolate: which logical part a mesh belongs to, so a click on
  // any point of the letterbox (or the fence + its mounting hardware) fades
  // everything else instead of highlighting a single triangle.
  function partForName(name) {
    if (name.indexOf('LETTERBOX') !== -1) return 'letterbox';
    return 'fence';
  }
  var parts = {
    letterbox: { materials: [brushedSteel], outlineMaterials: [], opacity: 1 },
    fence: { materials: [matteBlack, darkHardware], outlineMaterials: [], opacity: 1 }
  };
  var partDescriptions = {
    letterbox: 'Selected integrated metal letterbox',
    fence: 'Selected metal slat fence'
  };
  var pickTargets = [];
  var isolatedPart = null;

  function setIsolated(part) {
    isolatedPart = part;
    Object.keys(parts).forEach(function (key) {
      parts[key].opacity = (isolatedPart === null || key === isolatedPart) ? 1 : 0.08;
    });
    if (part && partDescriptions[part]) {
      infoBox.textContent = partDescriptions[part];
      infoBox.classList.add('visible');
    } else {
      infoBox.classList.remove('visible');
    }
  }

  // Part nav: steps through the same parts a direct click on the model
  // selects, in declaration order, wrapping in either direction.
  var partCycleOrder = Object.keys(parts);
  function cyclePart(direction) {
    var idx = isolatedPart ? partCycleOrder.indexOf(isolatedPart) : -1;
    var next = (idx + direction + partCycleOrder.length) % partCycleOrder.length;
    setIsolated(partCycleOrder[next]);
  }
  partNextBtn.addEventListener('click', function () { cyclePart(1); });
  partPrevBtn.addEventListener('click', function () { cyclePart(-1); });

  // Every material a click can dim needs transparent enabled up front — three.js
  // recompiles the material's shader when that flag changes, so it's set once
  // here rather than toggled per frame; opacity alone animates smoothly after.
  function armForIsolation() {
    Object.keys(parts).forEach(function (key) {
      parts[key].materials.concat(parts[key].outlineMaterials).forEach(function (m) {
        m.transparent = true;
        // Outline ink already sits at 0.85 opacity by design; isolation dims
        // relative to each material's own resting opacity, not a flat 1.0.
        m.userData.baseOpacity = m.opacity;
      });
    });
  }

  var raycaster = new THREE.Raycaster();
  var pointerDownPos = null;
  renderer.domElement.addEventListener('pointerdown', function (e) {
    pointerDownPos = { x: e.clientX, y: e.clientY };
  });
  renderer.domElement.addEventListener('pointerup', function (e) {
    if (!pointerDownPos) return;
    var dx = e.clientX - pointerDownPos.x, dy = e.clientY - pointerDownPos.y;
    pointerDownPos = null;
    if (Math.sqrt(dx * dx + dy * dy) > 6) return; // treat as a drag, not a click

    var rect = canvas.getBoundingClientRect();
    var ndc = new THREE.Vector2(
      ((e.clientX - rect.left) / rect.width) * 2 - 1,
      -((e.clientY - rect.top) / rect.height) * 2 + 1
    );
    raycaster.setFromCamera(ndc, camera);
    var hits = raycaster.intersectObjects(pickTargets.map(function (t) { return t.mesh; }), false);
    if (hits.length === 0) { setIsolated(null); return; }
    var hit = pickTargets.filter(function (t) { return t.mesh === hits[0].object; })[0];
    var part = hit ? hit.part : null;
    setIsolated(isolatedPart === part ? null : part);
  });

  var loader = new FBXLoader();
  try {
    var buffer = base64ToArrayBuffer(FBX_BASE64);
    var object = loader.parse(buffer, '');

    // Model ships lying on its back (CAD "3D view" export); stand it upright
    // with the anchor bolts facing down and the mail slot facing the default
    // camera, and drop the baked-in ground slab (unstyled CAD geometry) in
    // favor of the scene's own grid + contact shadow.
    object.rotation.set(Math.PI / 2, Math.PI, 0);

    var toRemove = [];
    var outlineTargets = [];
    object.traverse(function (child) {
      if (!child.isMesh) return;
      if (child.name.indexOf('Floors_1') !== -1) {
        toRemove.push(child);
        return;
      }
      child.castShadow = true;
      child.receiveShadow = true;
      var mat = materialForName(child.name);
      child.material = Array.isArray(child.material) ? child.material.map(function () { return mat; }) : mat;
      outlineTargets.push(child);
      pickTargets.push({ mesh: child, part: partForName(child.name) });
    });
    toRemove.forEach(function (child) { child.parent.remove(child); });
    // Added after traversal finishes, not during: mutating the tree with
    // mesh.add() mid-traverse would make traverse() walk into the freshly
    // added outline (LineSegments2 also satisfies isMesh) and outline it too,
    // recursing forever.
    outlineTargets.forEach(function (child) {
      var lineMat = addSketchOutline(child);
      parts[partForName(child.name)].outlineMaterials.push(lineMat);
    });
    armForIsolation();

    pivot.add(object);
    frameObject(object);
    defaultDistance = camera.position.distanceTo(controls.target);
    defaultView = { position: camera.position.clone(), target: controls.target.clone() };
    updateZoomReadout();

    loadingEl.classList.add('hidden');
    canvas.classList.add('ready');
    setTimeout(function () { loadingEl.style.display = 'none'; }, 550);
  } catch (err) {
    loadingMsg.textContent = 'Could not load model';
    spinnerEl.style.display = 'none';
    var errEl = document.createElement('div');
    errEl.className = 'err';
    errEl.textContent = (err && err.message) ? err.message : String(err);
    loadingEl.appendChild(errEl);
    console.error(err);
  }

  function onResize() {
    var w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    outlineMaterials.forEach(function (m) { m.resolution.set(w, h); });
  }
  window.addEventListener('resize', onResize);
  onResize();

  function updateIsolation() {
    Object.keys(parts).forEach(function (key) {
      var factor = parts[key].opacity;
      parts[key].materials.concat(parts[key].outlineMaterials).forEach(function (m) {
        var base = m.userData.baseOpacity !== undefined ? m.userData.baseOpacity : 1;
        var target = base * factor;
        m.opacity += (target - m.opacity) * 0.18;
      });
    });
  }

  function animate() {
    requestAnimationFrame(animate);
    updateCameraTween();
    controls.update();
    updateIsolation();
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
