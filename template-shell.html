<meta charset="UTF-8">
<title>Mayde Tate — 3D House Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bg-2: #f4f5f7;
    --panel-border: #e4e6eb;
    --text: #1a1c23;
    --muted: #9aa0ac;
    --accent: #2a2620;
    --accent-ui: #000000;
    --grid-line: #c7c9cf;
    --neu-dark: rgba(0, 0, 0, 0.12);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111318;
      --bg-2: #181a20;
      --panel-border: #2a2d35;
      --text: #e8eaed;
      --muted: #8b8f99;
      --accent: #ece7d9;
      --accent-ui: #f4f4f4;
      --grid-line: #43464f;
      --neu-dark: rgba(0, 0, 0, 0.55);
    }
  }

  :root[data-theme="dark"] {
    --bg: #111318;
    --bg-2: #181a20;
    --panel-border: #2a2d35;
    --text: #e8eaed;
    --muted: #8b8f99;
    --accent: #ece7d9;
    --accent-ui: #f4f4f4;
    --grid-line: #43464f;
    --neu-dark: rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow: hidden;
  }

  body {
    position: relative;
    background-color: var(--bg);
    background-image: radial-gradient(ellipse at 50% 42%, var(--bg) 0%, var(--bg-2) 100%);
  }

  #stage {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    outline: none;
  }

  .brand-logo {
    position: absolute;
    top: 34px;
    left: 34px;
    z-index: 6;
    color: var(--text);
    pointer-events: none;
  }
  .brand-logo svg { display: block; height: 24px; width: auto; filter: drop-shadow(0 6px 10px var(--neu-dark)) drop-shadow(0 2px 3px var(--neu-dark)); }

  .hint {
    position: absolute;
    bottom: 30px;
    right: 34px;
    z-index: 6;
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.04em;
    opacity: 0.75;
    text-align: right;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .hint.hidden { opacity: 0; }

  .info-box {
    position: absolute;
    bottom: 56px;
    left: 50%;
    width: max-content;
    max-width: 78vw;
    text-align: center;
    font-family: "Inter", Arial, Helvetica, "Segoe UI", sans-serif;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    background: #16161f;
    color: #ffffff;
    padding: 14px 26px;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    z-index: 6;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 6px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .info-box.visible { opacity: 1; transform: translate(-50%, 0); }

  .title-block {
    position: absolute;
    top: 34px;
    left: 50%;
    z-index: 6;
    text-align: center;
    pointer-events: none;
    transform: translateX(-50%);
    font-family: "Inter", Arial, Helvetica, "Segoe UI", sans-serif;
  }
  .title-block .title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text);
  }
  .title-block .subtitle {
    margin-top: 3px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .view-toggle {
    position: absolute;
    top: 30px;
    right: 34px;
    z-index: 6;
    display: flex;
    gap: 2px;
    background: var(--bg);
    border-radius: 999px;
    padding: 4px;
    box-shadow: 0 4px 14px var(--neu-dark);
  }
  .view-toggle button {
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: Arial, Helvetica, "Segoe UI", sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .view-toggle button.active { background: var(--accent-ui); color: var(--bg); }
  .view-toggle button:focus-visible { outline: 2px solid var(--accent-ui); outline-offset: 2px; }

  .topbar-tools {
    position: absolute;
    top: 92px;
    left: 34px;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .part-nav, .zoom-control {
    display: flex;
    align-items: center;
    background: var(--bg);
    border-radius: 999px;
    box-shadow: 0 4px 14px var(--neu-dark);
  }
  .part-nav { padding: 4px; gap: 2px; }
  .part-nav button, .zoom-control button {
    border: none;
    background: transparent;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .part-nav button { width: 32px; height: 32px; }
  .part-nav button svg { width: 16px; height: 16px; }
  .part-nav button:hover, .zoom-control button:hover { background: var(--bg-2); }
  .part-nav .divider { width: 1px; height: 18px; background: var(--panel-border); }
  .zoom-control { padding: 4px 6px; gap: 6px; }
  .zoom-control button { width: 28px; height: 28px; }
  .zoom-control button svg { width: 14px; height: 14px; }
  .zoom-control .zoom-value {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--muted);
    min-width: 34px;
    text-align: center;
    letter-spacing: 0.02em;
  }
  .part-nav button:focus-visible, .zoom-control button:focus-visible {
    outline: 2px solid var(--accent-ui);
    outline-offset: 2px;
  }

  .spin-toggle {
    position: absolute;
    left: 50%;
    top: 152px;
    z-index: 6;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    border: none;
    background: var(--bg);
    color: var(--text);
    border-radius: 999px;
    padding: 16px 22px;
    cursor: pointer;
    font-family: Arial, Helvetica, "Segoe UI", sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    box-shadow: 0 4px 14px var(--neu-dark);
    transition: background 0.2s ease, color 0.2s ease, box-shadow 0.15s ease, transform 0.1s ease, opacity 0.2s ease;
  }
  .spin-toggle svg { width: 20px; height: 20px; display: block; }
  .spin-toggle:hover { box-shadow: 0 6px 18px var(--neu-dark); }
  .spin-toggle:active { transform: translateX(-50%) scale(0.97); }
  .spin-toggle.engaged { background: var(--accent-ui); color: var(--bg); }
  .spin-toggle:disabled { opacity: 0.4; cursor: not-allowed; }
  .spin-toggle:focus-visible { outline: 2px solid var(--accent-ui); outline-offset: 3px; }

  #loading {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--bg);
    transition: opacity 0.5s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid var(--panel-border);
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 1.6s; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading .msg {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #loading .err {
    color: var(--accent);
    font-size: 12px;
    max-width: 360px;
    text-align: center;
    letter-spacing: 0.02em;
    text-transform: none;
  }

  #stage.ready { animation: fadein 0.6s ease both; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  /* --- 3D callout hotspots / leader lines / info panel ------------------ */

  #leader-svg {
    position: absolute;
    inset: 0;
    z-index: 5;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .leader-line {
    stroke: var(--text);
    stroke-width: 1;
    opacity: 0;
    transition: opacity 0.2s ease, stroke-width 0.2s ease;
  }
  .leader-line.shown { opacity: 0.45; }
  .leader-line.hovered, .leader-line.active.shown { opacity: 0.85; stroke-width: 1.5; }

  #hotspot-layer { position: absolute; inset: 0; z-index: 6; pointer-events: none; }

  .hotspot {
    position: absolute;
    top: 0;
    left: 0;
    width: 14px;
    height: 14px;
    margin: -7px 0 0 -7px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--accent-ui);
    box-shadow: 0 3px 10px var(--neu-dark);
    cursor: pointer;
    pointer-events: auto;
    transition: transform 0.18s ease, opacity 0.25s ease, background 0.18s ease, border-color 0.18s ease;
  }
  .hotspot::after {
    content: '';
    position: absolute;
    inset: -7px;
    border-radius: 50%;
    border: 1px solid var(--accent-ui);
    opacity: 0.45;
    animation: hotspotPulse 2.6s ease-out infinite;
  }
  @media (prefers-reduced-motion: reduce) { .hotspot::after { animation: none; } }
  @keyframes hotspotPulse {
    0% { transform: scale(0.65); opacity: 0.5; }
    100% { transform: scale(2.1); opacity: 0; }
  }
  .hotspot:hover, .hotspot.hovered { transform: scale(1.4); }
  .hotspot.active { background: var(--accent-ui); border-color: var(--accent-ui); }
  .hotspot.active::after { display: none; }
  .hotspot.occluded { opacity: 0.22; }
  .hotspot.behind { display: none; }
  .hotspot:focus-visible { outline: 2px solid var(--accent-ui); outline-offset: 3px; }

  .callout-label {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 6;
    transform: translate(-50%, -100%);
    font-family: "Inter", Arial, Helvetica, "Segoe UI", sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text);
    background: var(--bg);
    padding: 5px 10px;
    border-radius: 8px;
    box-shadow: 0 4px 12px var(--neu-dark);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .callout-label.shown { opacity: 1; transform: translate(-50%, -100%) translateY(-6px); }

  .callout-panel {
    position: absolute;
    right: 34px;
    bottom: 34px;
    z-index: 8;
    width: 300px;
    max-width: calc(100vw - 68px);
    max-height: calc(100vh - 68px);
    overflow-y: auto;
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    box-shadow: 0 14px 36px var(--neu-dark);
    padding: 22px 24px 20px;
    font-family: "Inter", Arial, Helvetica, "Segoe UI", sans-serif;
    opacity: 0;
    pointer-events: none;
    transform: translateY(14px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .callout-panel.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .callout-panel .cp-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 26px;
    height: 26px;
    border: none;
    background: transparent;
    color: var(--muted);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .callout-panel .cp-close:hover { background: var(--bg-2); color: var(--text); }
  .callout-panel .cp-close svg { width: 14px; height: 14px; }
  .cp-eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .cp-title {
    margin-top: 4px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--text);
    padding-right: 20px;
  }
  .cp-body .cp-field { margin-top: 13px; }
  .cp-body .cp-field .k {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 9.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .cp-body .cp-field .v { margin-top: 3px; font-size: 13px; line-height: 1.45; color: var(--text); }
  .cp-body .cp-pending { margin-top: 13px; font-size: 12px; line-height: 1.5; color: var(--muted); font-style: italic; }
  .cp-back {
    display: block;
    margin-top: 18px;
    border: none;
    background: var(--bg-2);
    color: var(--text);
    font-family: Arial, Helvetica, "Segoe UI", sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 10px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .cp-back:hover { background: var(--panel-border); }

  @media (max-width: 640px) {
    .callout-panel { left: 18px; right: 18px; bottom: 22px; width: auto; }
  }

  @media (max-width: 640px) {
    .brand-logo { top: 20px; left: 20px; }
    .brand-logo svg { height: 20px; }
    .hint { left: 20px; right: 18px; }
    .title-block { display: none; }
    .view-toggle { top: 18px; right: 18px; padding: 3px; }
    .view-toggle button { padding: 6px 10px; font-size: 10px; }
    .topbar-tools { top: 62px; left: 18px; gap: 6px; }
    .zoom-control .zoom-value { min-width: 28px; font-size: 10px; }
    .info-box { bottom: 30px; }
    .spin-toggle { top: 108px; padding: 12px 16px; font-size: 11px; }
    .spin-toggle svg { width: 17px; height: 17px; }
  }
</style>

<canvas id="stage" role="img" aria-label="Interactive 3D view of the Mayde Tate house. Drag to orbit, click a marker for building details."></canvas>

</div>

<div class="topbar-tools">
  <div class="part-nav">
    <button type="button" id="part-prev" aria-label="Previous callout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"></polyline></svg>
    </button>
    <span class="divider"></span>
    <button type="button" id="part-next" aria-label="Next callout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>
    </button>

  <div class="zoom-control">
    <button type="button" id="zoom-out" aria-label="Zoom out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
    <span class="zoom-value" id="zoom-value">100%</span>
    <button type="button" id="zoom-in" aria-label="Zoom in">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line><line x1="12" y1="5" x2="12" y2="19"></line></svg>
    </button>

<div class="info-box" id="info-box"></div>

<svg id="leader-svg" aria-hidden="true"></svg>
<div id="hotspot-layer"></div>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
  </button>
  <div class="cp-eyebrow" id="cp-eyebrow">Building Element</div>
  <div class="cp-title" id="cp-title"></div>

</div>

<button type="button" class="spin-toggle" id="spin-toggle" aria-label="Toggle auto-rotate" aria-pressed="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 3 6.7"></path><polyline points="3 17 3 21 7 21"></polyline></svg>
  <span>360&deg;</span>
</button>

<div id="loading">
  <div class="spinner" id="spinner"></div>
  <div class="msg" id="loading-msg">Loading model&hellip;</div>
</div>

<script>
/*__BUNDLE_JS__*/
</script>

<script>
(function () {
  var THREE = window.THREE;
  var GLTFLoader = window.GLTFLoader;
  var OrbitControls = window.OrbitControls;
  var RoomEnvironment = window.RoomEnvironment;
  var LineSegments2 = window.LineSegments2;
  var LineSegmentsGeometry = window.LineSegmentsGeometry;
  var LineMaterial = window.LineMaterial;

  var canvas = document.getElementById('stage');
  var loadingEl = document.getElementById('loading');
  var loadingMsg = document.getElementById('loading-msg');
  var spinnerEl = document.getElementById('spinner');
  var dragHint = document.getElementById('drag-hint');
  var infoBox = document.getElementById('info-box');
  var partPrevBtn = document.getElementById('part-prev');
  var partNextBtn = document.getElementById('part-next');
  var zoomInBtn = document.getElementById('zoom-in');
  var zoomOutBtn = document.getElementById('zoom-out');
  var zoomValueEl = document.getElementById('zoom-value');
  var viewToggle = document.getElementById('view-toggle');
  var viewToggleBtns = viewToggle.querySelectorAll('button');
  var spinToggle = document.getElementById('spin-toggle');
  var hotspotLayer = document.getElementById('hotspot-layer');
  var leaderSvg = document.getElementById('leader-svg');
  var calloutPanel = document.getElementById('callout-panel');
  var cpEyebrow = document.getElementById('cp-eyebrow');
  var cpTitle = document.getElementById('cp-title');
  var cpBody = document.getElementById('cp-body');
  var cpClose = document.getElementById('cp-close');
  var cpBack = document.getElementById('cp-back');

  function readAccent() {
    var v = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    return v || '#2a2620';
  }
  function readBg() {
    var v = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    return v || '#15130f';
  }
  function readGridColor() {
    var v = getComputedStyle(document.documentElement).getPropertyValue('--grid-line').trim();
    return v || '#c7c9cf';
  }

  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  // Nothing that casts or receives a shadow ever moves — no exploded view,
  // no light animation, only the camera orbits, and shadows don't depend on
  // camera position. Recomputing the shadow map every frame (three.js's
  // default) means a full depth pass over the whole house 60x/sec for no
  // reason; render it once after the model loads instead (see the loader
  // below) and this render target then stays valid for the session.
  renderer.shadowMap.autoUpdate = false;

  var scene = new THREE.Scene();
  var bgColor = new THREE.Color(readBg());
  scene.fog = new THREE.Fog(bgColor.getHex(), 6, 22);

  var camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.05, 200);
  camera.position.set(3.1, 1.7, 3.6);

  var controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 1.2;
  controls.maxDistance = 12;
  controls.maxPolarAngle = Math.PI * 0.53;
  controls.target.set(0, 0.5, 0);
  controls.update();

  // Lighting: warm key + cool fill + soft rim, studio-style.
  var hemi = new THREE.HemisphereLight(0xfff3e0, 0x14110c, 0.65);
  scene.add(hemi);

  var key = new THREE.DirectionalLight(0xfff1de, 2.1);
  key.position.set(3.2, 4.4, 2.6);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.near = 1;
  key.shadow.camera.far = 14;
  key.shadow.camera.left = -3;
  key.shadow.camera.right = 3;
  key.shadow.camera.top = 3;
  key.shadow.camera.bottom = -3;
  key.shadow.bias = -0.0015;
  key.shadow.radius = 3;
  scene.add(key);

  var fill = new THREE.DirectionalLight(0x9fc7ff, 0.55);
  fill.position.set(-3.5, 1.8, -1.5);
  scene.add(fill);

  var rim = new THREE.DirectionalLight(0xffd9ad, 0.9);
  rim.position.set(-1.2, 2.6, -3.4);
  scene.add(rim);

  // Ground grid: real 3D geometry using the scene's actual camera, so it's
  // inherently perspective-correct and shares the model's own vanishing

  // Every real building element survives in its node name as
  // "<Revit Type Name> _<Revit Element ID>_" (confirmed in the build
  // report). The 9 "GH - 3D DETAIL CALL OUT" spheres use the same pattern
  // and are the Revit-authored anchor markers for the callout system below
  // — they're identified and stripped from the render, never shown. Several
  // generic-model families export with their name doubled (e.g.
  // "capping capping"); that's collapsed here for a cleaner display name.
  //
  // GLTFLoader sanitizes node names on the way in (THREE.PropertyBinding's
  // node-name rules), turning every space into "_" — so the raw name here
  // arrives as e.g. "Basic_Wall_Hebel_-_75mm__314353_", not the original
  // "Basic Wall Hebel - 75mm _314353_". Parsing has to account for that.
  function parseElementName(rawName) {
    var m = /^(.*?)_+(\d+)_+$/.exec(rawName);
    var typeName = m ? m[1] : rawName;
    var elementId = m ? m[2] : null;
    typeName = typeName.replace(/_/g, ' ').replace(/\s+/g, ' ').trim();
    var dup = /^(.+) \1$/.exec(typeName);
    if (dup) typeName = dup[1];
    return { typeName: typeName, elementId: elementId };
  }

  // Click-to-isolate, generalized from the letterbox's two hand-picked
  // parts to one entry per real building element: every mesh dims to 0.08
  // opacity except whichever one (if any) is isolated. `buildingMeshes` is
  // the full picklist for both direct-model raycasting and callout-driven
  // highlighting; `meshByElementId` lets a callout's `revitElement`
  // metadata field find its mesh back.
  var buildingMeshes = [];
  var meshByElementId = {};
  var pickableMeshList = [];
  var isolatedEntry = null;

  function setIsolatedMesh(entry) {
    isolatedEntry = entry || null;
    buildingMeshes.forEach(function (e) {
      e.targetOpacity = (isolatedEntry === null || e === isolatedEntry) ? 1 : 0.08;
    });
  }

  // Every material a click can dim needs transparent enabled up front — three.js
  // recompiles the material's shader when that flag changes, so it's set once
  // here rather than toggled per frame; opacity alone animates smoothly after.
  function armForIsolation() {
    buildingMeshes.forEach(function (e) {
      [e.material, e.outlineMaterial].forEach(function (m) {
        if (!m) return;
        m.transparent = true;
        // Outline ink already sits at 0.85 opacity by design; isolation dims
        // relative to each material's own resting opacity, not a flat 1.0.
        m.userData.baseOpacity = m.opacity;
      });
    });
  }

  function updateIsolation() {
    buildingMeshes.forEach(function (e) {
      [e.material, e.outlineMaterial].forEach(function (m) {
        if (!m) return;
        var base = m.userData.baseOpacity !== undefined ? m.userData.baseOpacity : 1;
        var target = base * e.targetOpacity;
        m.opacity += (target - m.opacity) * 0.18;
      });
    });
  }

  // --- 3D callout system ---------------------------------------------
  // Anchor positions come only from the Revit sphere markers found in the
  // model (captured in calloutAnchorWorldPos below, after the model has
  // been framed) — never hand-entered coordinates. Content (title, product,
  // material, manufacturer, NATSPEC...) is loaded separately from
  // data/callouts.json and matched to a sphere by its `anchor` field (the
  // sphere's real Revit Element ID), so new products can be added without
  // touching any rendering code.
  var calloutAnchorWorldPos = {};
  var callouts = [];
  var calloutCycleOrder = [];
  var activeCallout = null;
  var hoveredCallout = null;

  function addPanelField(container, label, value) {
    if (value === null || value === undefined || value === '') return;
    var field = document.createElement('div');
    field.className = 'cp-field';
    var k = document.createElement('div'); k.className = 'k'; k.textContent = label;
    var v = document.createElement('div'); v.className = 'v'; v.textContent = value;
    field.appendChild(k); field.appendChild(v);
    container.appendChild(field);
  }

  function renderCalloutPanel(def) {
    cpEyebrow.textContent = def.natspec ? ('NATSPEC ' + def.natspec) : 'Building Element';
    cpTitle.textContent = def.title || ('Callout · anchor ' + def.anchor);
    cpBody.innerHTML = '';
    addPanelField(cpBody, 'Product', def.product);
    addPanelField(cpBody, 'Material', def.material);
    addPanelField(cpBody, 'Manufacturer', def.manufacturer);
    addPanelField(cpBody, 'Revit Material', def.revitMaterial);
    addPanelField(cpBody, 'Revit Element', def.revitElementName ? (def.revitElementName + ' · ID ' + def.revitElement) : def.revitElement);
    addPanelField(cpBody, 'Description', def.description);
    if (def.status === 'pending') {
      var pending = document.createElement('div');
      pending.className = 'cp-pending';
      pending.textContent = 'Product and material information for this callout hasn’t been supplied yet.';
      cpBody.appendChild(pending);
    }
  }

  function flyToCallout(c) {
    var target = c.worldPos.clone();
    var dir = camera.position.clone().sub(controls.target);
    if (dir.lengthSq() < 1e-6) dir.set(0, 0.4, 1);
    dir.normalize();
    var closeDist = defaultDistance ? Math.max(controls.minDistance * 1.3, defaultDistance * 0.24) : controls.minDistance * 1.5;
    var newPos = target.clone().addScaledVector(dir, closeDist);
    tweenCameraTo(newPos, target, 800);
  }

  function selectCallout(c) {
    activeCallout = c;
    callouts.forEach(function (o) { o.hotspotEl.classList.toggle('active', o === c); });
    renderCalloutPanel(c.data);
    calloutPanel.classList.add('visible');
    infoBox.classList.remove('visible');
    setIsolatedMesh(c.linkedEntry);
    flyToCallout(c);
  }

  function clearCallout() {
    activeCallout = null;
    callouts.forEach(function (o) { o.hotspotEl.classList.remove('active'); });
    calloutPanel.classList.remove('visible');
    setIsolatedMesh(null);
  }

  function returnToOverview() {
    clearCallout();
    if (defaultView) tweenCameraTo(defaultView.position, defaultView.target, 700);
  }

  cpClose.addEventListener('click', clearCallout);
  cpBack.addEventListener('click', returnToOverview);

  function setHovered(c) {
    hoveredCallout = c;
    callouts.forEach(function (o) {
      o.hotspotEl.classList.toggle('hovered', o === c);
      o.lineEl.classList.toggle('hovered', o === c);
    });
  }

  function initHotspots(calloutDefs) {
    calloutDefs.forEach(function (def) {
      var pos = calloutAnchorWorldPos[def.anchor];
      if (!pos) {
        console.warn('house.glb has no "GH - 3D DETAIL CALL OUT" sphere for anchor', def.anchor, '(callout "' + def.id + '" skipped)');
        return;
      }
      var hotspotEl = document.createElement('button');
      hotspotEl.type = 'button';
      hotspotEl.className = 'hotspot';
      hotspotEl.setAttribute('aria-label', def.title || ('Building detail, anchor ' + def.anchor));
      hotspotLayer.appendChild(hotspotEl);

      var labelEl = document.createElement('div');
      labelEl.className = 'callout-label';
      hotspotLayer.appendChild(labelEl);

      var lineEl = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      lineEl.setAttribute('class', 'leader-line');
      leaderSvg.appendChild(lineEl);

      var c = {
        data: def,
        worldPos: pos,
        linkedEntry: def.revitElement ? meshByElementId[def.revitElement] : undefined,
        hotspotEl: hotspotEl,
        labelEl: labelEl,
        lineEl: lineEl
      };
      callouts.push(c);

      hotspotEl.addEventListener('mouseenter', function () { setHovered(c); });
      hotspotEl.addEventListener('mouseleave', function () { if (hoveredCallout === c) setHovered(null); });
      hotspotEl.addEventListener('focus', function () { setHovered(c); });
      hotspotEl.addEventListener('blur', function () { if (hoveredCallout === c) setHovered(null); });
      hotspotEl.addEventListener('click', function () { selectCallout(c); });
    });
    calloutCycleOrder = callouts.slice();
  }

  function cycleCallout(direction) {
    if (!calloutCycleOrder.length) return;
    var idx = activeCallout ? calloutCycleOrder.indexOf(activeCallout) : -1;
    var next = (idx + direction + calloutCycleOrder.length) % calloutCycleOrder.length;
    selectCallout(calloutCycleOrder[next]);
  }
  partNextBtn.addEventListener('click', function () { cycleCallout(1); });
  partPrevBtn.addEventListener('click', function () { cycleCallout(-1); });

  var _projected = new THREE.Vector3();
  var _rayDir = new THREE.Vector3();
  var hotspotFrameCount = 0;
  // The occlusion test below is a real raycast against every building mesh,
  // once per callout — cheap for a handful of hotspots against a simple
  // model, but this house has 9 callouts against ~90 meshes, and running
  // that at 60fps regardless of whether the camera even moved was the
  // single biggest cost in the render loop (worse than the shadow pass).
  // Occlusion visibly lagging a few frames behind is imperceptible, so it's
  // recomputed at 1/6th rate; screen position (what actually needs to track
  // the camera smoothly) still updates every frame.
  var OCCLUSION_EVERY_N_FRAMES = 6;
  function updateHotspots() {
    if (!callouts.length) return;
    hotspotFrameCount++;
    var recomputeOcclusion = pickableMeshList.length > 0 && (hotspotFrameCount % OCCLUSION_EVERY_N_FRAMES === 0);
    var rect = canvas.getBoundingClientRect();
    callouts.forEach(function (c) {
      _projected.copy(c.worldPos).project(camera);
      var behind = _projected.z > 1 || _projected.z < -1;
      c.hotspotEl.classList.toggle('behind', behind);
      if (behind) { c.lineEl.classList.remove('shown'); c.labelEl.classList.remove('shown'); return; }

      var x = rect.left + (_projected.x * 0.5 + 0.5) * rect.width;
      var y = rect.top + (-_projected.y * 0.5 + 0.5) * rect.height;
      c.hotspotEl.style.left = x + 'px';
      c.hotspotEl.style.top = y + 'px';

      var showLabel = c === hoveredCallout || c === activeCallout;
      c.labelEl.textContent = c.data.title || ('Callout · ' + c.data.anchor);
      c.labelEl.style.left = x + 'px';
      c.labelEl.style.top = (y - 16) + 'px';
      c.labelEl.classList.toggle('shown', showLabel);

      c.lineEl.setAttribute('x1', x);
      c.lineEl.setAttribute('y1', y - 16);
      c.lineEl.setAttribute('x2', x);
      c.lineEl.setAttribute('y2', y);
      c.lineEl.classList.toggle('shown', showLabel);
      c.lineEl.classList.toggle('active', c === activeCallout);

      // Occlusion: de-emphasize (not hide) a hotspot whose anchor sits
      // behind the house's own geometry from the current camera angle.
      if (recomputeOcclusion) {
        _rayDir.copy(c.worldPos).sub(camera.position);
        var distToAnchor = _rayDir.length();
        _rayDir.normalize();
        raycaster.set(camera.position, _rayDir);
        raycaster.far = distToAnchor;
        raycaster.near = 0;
        var hits = raycaster.intersectObjects(pickableMeshList, false);
        raycaster.far = Infinity;
        c.occluded = hits.length > 0 && hits[0].distance < distToAnchor - 0.02;
      }
      c.hotspotEl.classList.toggle('occluded', !!c.occluded && c !== activeCallout);
    });
  }

  var raycaster = new THREE.Raycaster();
  var pointerDownPos = null;
  renderer.domElement.addEventListener('pointerdown', function (e) {
    pointerDownPos = { x: e.clientX, y: e.clientY };
  });
  renderer.domElement.addEventListener('pointerup', function (e) {
    if (!pointerDownPos) return;
    var dx = e.clientX - pointerDownPos.x, dy = e.clientY - pointerDownPos.y;
    pointerDownPos = null;
    if (Math.sqrt(dx * dx + dy * dy) > 6) return; // treat as a drag, not a click

    var rect = canvas.getBoundingClientRect();
    var ndc = new THREE.Vector2(
      ((e.clientX - rect.left) / rect.width) * 2 - 1,
      -((e.clientY - rect.top) / rect.height) * 2 + 1
    );
    raycaster.far = Infinity;
    raycaster.setFromCamera(ndc, camera);
    var hits = raycaster.intersectObjects(pickableMeshList, false);
    if (hits.length === 0) {
      if (!activeCallout) { setIsolatedMesh(null); infoBox.classList.remove('visible'); }
      return;
    }
    var entry = buildingMeshes.filter(function (t) { return t.mesh === hits[0].object; })[0];
    if (!entry) return;

    // Clicking the model directly identifies the element in the plain
    // info-box; clicking a callout hotspot is what opens the full product
    // panel. But if this exact element is what a callout's metadata points
    // at (revitElement), surface that connection by opening the callout —
    // this is the "Revit Element -> Callout -> Product" chain from the brief.
    var linkedCallout = callouts.filter(function (c) { return c.linkedEntry === entry; })[0];
    if (linkedCallout) { selectCallout(linkedCallout); return; }

    clearCallout();
    setIsolatedMesh(isolatedEntry === entry ? null : entry);
    if (isolatedEntry) {
      infoBox.textContent = entry.typeName + (entry.elementId ? ' · Element ' + entry.elementId : '');
      infoBox.classList.add('visible');
    } else {
      infoBox.classList.remove('visible');
    }
  });

  var loader = new GLTFLoader();
  var calloutDataPromise = fetch('data/callouts.json').then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }).then(function (json) {
    return json.callouts || [];
  }).catch(function (err) {
    console.warn('Callout metadata (data/callouts.json) unavailable:', err);
    return [];
  });

  loader.load('house.glb', function (gltf) {
    var object = gltf.scene;

    // Export is Z-up (Revit/FBX convention); this scene (grid, camera,
    // lighting) is authored Y-up, same correction the letterbox FBX needed.
    object.rotation.x = -Math.PI / 2;

    var sphereNodes = [];
    var outlineTargets = [];
    object.traverse(function (child) {
      if (!child.isMesh) return;
      if (child.name.indexOf('CALL_OUT') !== -1) {
        // Revit-authored callout anchor marker — never rendered, only used
        // for its 3D position (captured below once the model is framed).
        sphereNodes.push(child);
        return;
      }
      child.castShadow = true;
      child.receiveShadow = true;
      var parsed = parseElementName(child.name);
      var mat = materialForName(parsed.typeName).clone();
      child.material = mat;
      outlineTargets.push({ mesh: child, parsed: parsed, material: mat });
    });

    // Added after traversal finishes, not during: mutating the tree with
    // mesh.add() mid-traverse would make traverse() walk into the freshly
    // added outline (LineSegments2 also satisfies isMesh) and outline it too,
    // recursing forever.
    outlineTargets.forEach(function (t) {
      var lineMat = addSketchOutline(t.mesh);
      var entry = {
        mesh: t.mesh,
        material: t.material,
        outlineMaterial: lineMat,
        typeName: t.parsed.typeName,
        elementId: t.parsed.elementId,
        targetOpacity: 1
      };
      buildingMeshes.push(entry);
      if (entry.elementId) meshByElementId[entry.elementId] = entry;
    });
    pickableMeshList = buildingMeshes.map(function (e) { return e.mesh; });
    armForIsolation();

    pivot.add(object);
    frameObject(object);
    object.updateMatrixWorld(true);

    // Capture each sphere's *world* position now that the model has been
    // scaled/positioned by frameObject() — these are the real anchor
    // points, sourced entirely from the Revit-modelled markers, not
    // invented coordinates — then strip the spheres from the render.
    sphereNodes.forEach(function (sphere) {
      var id = parseElementName(sphere.name).elementId;
      if (id) {
        var v = new THREE.Vector3();
        sphere.getWorldPosition(v);
        calloutAnchorWorldPos[id] = v;
      }
      if (sphere.parent) sphere.parent.remove(sphere);
    });

    defaultDistance = camera.position.distanceTo(controls.target);
    defaultView = { position: camera.position.clone(), target: controls.target.clone() };
    updateZoomReadout();

    calloutDataPromise.then(function (defs) {
      initHotspots(defs);
    });

    renderer.shadowMap.needsUpdate = true; // one-time: see autoUpdate note above

    loadingEl.classList.add('hidden');
    canvas.classList.add('ready');
    setTimeout(function () { loadingEl.style.display = 'none'; }, 550);
  }, function (xhr) {
    if (xhr.lengthComputable && xhr.total) {
      loadingMsg.textContent = 'Loading model… ' + Math.round((xhr.loaded / xhr.total) * 100) + '%';
    }
  }, function (err) {
    loadingMsg.textContent = 'Could not load model';
    spinnerEl.style.display = 'none';
    var errEl = document.createElement('div');
    errEl.className = 'err';
    errEl.textContent = (err && err.message) ? err.message : String(err);
    loadingEl.appendChild(errEl);
    console.error(err);
  });

  function onResize() {
    var w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    outlineMaterials.forEach(function (m) { m.resolution.set(w, h); });
  }
  window.addEventListener('resize', onResize);
  onResize();

  function animate() {
    requestAnimationFrame(animate);
    updateCameraTween();
    controls.update();
    updateIsolation();
    updateHotspots();
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
